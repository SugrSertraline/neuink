[package]
name = "neuink-ipc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
base64.workspace = true
chrono.workspace = true
neuink-config = { path = "../neuink-config" }
neuink-domain = { path = "../neuink-domain" }
neuink-job = { path = "../neuink-job" }
neuink-parser = { path = "../neuink-parser" }
neuink-search = { path = "../neuink-search" }
neuink-sciverse = { path = "../neuink-sciverse" }
neuink-workspace = { path = "../neuink-workspace" }
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml = { version = "0.39.4", features = ["serialize"] }
scraper = { version = "0.24", default-features = false }
encoding_rs = "0.8"
tempfile = "3"
tauri.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "process", "io-util", "time"] }
tokio-stream.workspace = true
zip.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
webview2-com = "0.38.2"
windows-core = "0.61.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["crypto-rust", "linux-native-sync-persistent"] }

[features]
default = ["local-embedding"]
local-embedding = ["neuink-search/local-embedding"]
