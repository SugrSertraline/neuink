[package]
name = "neuink-ipc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Rasterizes PDF pages in-process, so the visual channel needs no Python and no AGPL PDF
# library. Dynamic linking: the PDFium DLL ships in resources and binds at startup.
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "image_025", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
blake3.workspace = true
sha2 = "0.10"
base64.workspace = true
chrono.workspace = true
neuink-config = { path = "../neuink-config" }
neuink-sync = { path = "../neuink-sync" }
neuink-sync-protocol = { path = "../neuink-sync-protocol" }
neuink-domain = { path = "../neuink-domain" }
neuink-job = { path = "../neuink-job" }
neuink-parser = { path = "../neuink-parser" }
neuink-search = { path = "../neuink-search" }
neuink-sciverse = { path = "../neuink-sciverse" }
neuink-workspace = { path = "../neuink-workspace" }
neuink-zotero = { path = "../neuink-zotero" }
futures-util.workspace = true
rayon.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml = { version = "0.39.4", features = ["serialize"] }
scraper = { version = "0.24", default-features = false }
subtp = "0.2.0"
encoding_rs = "0.8"
tempfile = "3"
tauri.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "process", "io-util", "time", "net"] }
tokio-stream.workspace = true
zip.workspace = true
unrar = "0.5.8"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
webview2-com = "0.38.2"
windows-core = "0.61.2"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["crypto-rust", "linux-native-sync-persistent"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["local-embedding"]
local-embedding = ["neuink-search/local-embedding"]


