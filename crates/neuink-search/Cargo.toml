[package]
name = "neuink-search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
fastembed = { workspace = true, optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "api-24"], optional = true }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"], optional = true }
neuink-domain = { path = "../neuink-domain" }
rayon.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = []
local-embedding = ["dep:fastembed", "dep:ort", "dep:tokenizers"]


