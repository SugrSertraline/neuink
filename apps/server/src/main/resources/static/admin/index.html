<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NeuInk 管理</title><link rel="stylesheet" href="/admin/admin.css"><script src="/admin/admin.js" defer></script></head>
<body><main><header><h1>NeuInk 管理</h1><button id="logout" hidden>退出管理</button></header><p id="status" role="status" aria-live="polite"></p>
<form id="login"><h2>管理员登录</h2><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button><p>会话 15 分钟后到期。普通账号无权访问管理功能。</p></form>
<div id="workspace" hidden><section><h2>备份状态</h2><p id="backup">正在读取…</p><button id="backup-refresh">刷新备份状态</button></section><section><h2>注册与邀请</h2><form id="policy"><label>普通账号名额上限<input name="max_accounts" type="number" min="0" max="2147483647" required></label><button>保存上限</button></form><p id="registered"></p><button id="invite">生成一次性邀请码</button><output id="secret"></output><p>邀请码与重置凭据仅显示在此页面，请通过可信方式交给本人；刷新页面后不再显示。</p></section>
<section><h2>账号</h2><label>筛选已读取账号<input id="filter" type="search" placeholder="用户名"></label><button id="refresh">重新读取</button><div class="table-scroll" tabindex="0" aria-label="账号列表"><table><thead><tr><th>用户名</th><th>身份</th><th>状态</th><th>配额（字节）</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div><button id="more">读取下一页</button><pre id="storage" aria-live="polite"></pre></section>
<section><h2>管理审计</h2><button id="audit-refresh">重新读取审计</button><ol id="audit"></ol><button id="audit-more">读取更早记录</button></section></div></main></body></html>
