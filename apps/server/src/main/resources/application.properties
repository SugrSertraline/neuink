spring.application.name=neuink-sync
server.address=${NEUINK_SERVER_ADDRESS:127.0.0.1}
server.port=${NEUINK_SERVER_PORT:8790}
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
spring.threads.virtual.enabled=true
spring.datasource.url=${NEUINK_DATABASE_URL}
spring.datasource.username=${NEUINK_DATABASE_USER:neuink}
spring.datasource.password=${NEUINK_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '30s'
spring.flyway.baseline-on-migrate=false
spring.servlet.multipart.enabled=false
spring.mvc.log-request-details=false
neuink.storage=${NEUINK_SERVER_STORAGE:server-data}
